# Input for konflux-ci/rpm-lockfile-prototype.
#
# Resolves the build-time RPMs that the builder stage needs (git, so uv can
# fetch the internal git dependency; ca-certificates for TLS) so the resolved
# rpms.lock.yaml can be committed. Committing the lockfile lets the Konflux
# prefetch stage (Hermeto) serve these RPMs from the package proxy instead of a
# live `microdnf install` against packages.redhat.com, which is throttled in
# the build network and was timing out (Curl error 28).
#
# contentOrigin.repos points at the public Project Hummingbird content, the
# same repo the hardened base image (registry.access.redhat.com/hi/python)
# installs from. The generator is invoked with --image <builder base> so
# packages already present in the base are excluded from the lockfile.
#
# repoid MUST be the arch-qualified repository id, not a shortened label.
# Hermeto copies it verbatim into the SBOM as repository_id, and Enterprise
# Contract's rpm_repos.ids_known rule matches that value exactly against its
# known_rpm_repositories list. That list carries only the arch-qualified ids
# (public-hummingbird-{x86_64,aarch64,ppc64le,s390x}-rpms, plus
# public-hummingbird-source-rpms); a bare "public-hummingbird" is absent, so
# every prefetched RPM is reported as coming from an unknown repository and the
# release gate fails. The id is a label only -- baseurl below is what is
# actually fetched -- so it must be kept consistent with that list.
#
# Regenerate with ./hack/gen-rpm-lockfile.sh whenever this list or the base
# image digest in the Containerfile changes.
contentOrigin:
  repos:
    - repoid: public-hummingbird-x86_64-rpms
      baseurl: https://packages.redhat.com/api/pulp-content/public-hummingbird/$basearch/
packages:
  - git
  - ca-certificates
arches:
  - x86_64
