# Example secrets for production overlays — do not commit real values.
# Apply after copying to secret.yaml (gitignored) or inject via your platform's
# secret manager / ExternalSecrets operator.
---
apiVersion: v1
kind: Secret
metadata:
  name: laas-secrets
  labels:
    app.kubernetes.io/name: laas
    app.kubernetes.io/component: ledger-service
type: Opaque
stringData:
  # Required when LAAS_BACKEND_TYPE=db (set in configmap or here).
  # LAAS_DATABASE_URL: "postgresql+psycopg://laas:CHANGE_ME@postgres:5432/laas"

  # Required under LAAS_AUTH_MODE=oidc, which is the default. These are not
  # secret in themselves — set them in the ConfigMap unless your issuer URLs are
  # sensitive; they are listed here because they are required, not because they
  # are credentials.
  # LAAS_OIDC_JWKS_URL: "https://sso.example.com/realms/your-realm/protocol/openid-connect/certs"
  # LAAS_OIDC_ISSUER: "https://sso.example.com/realms/your-realm"
  # LAAS_OIDC_AUDIENCE: "laas-api"

  # Optional LDAP employee directory — a cross-check on an already-authenticated
  # identity, never the identity proof. Both server and base DN are required
  # together; leave them unset and the check does not run.
  # LAAS_LDAP_SERVER: "ldaps://ldap.example.com"
  # LAAS_LDAP_BASE_DN: "dc=example,dc=com"

  # Service credential for the directory SEARCH. Without it the search binds
  # anonymously, and a directory that refuses anonymous access returns zero rows
  # with a non-success result code — which the adapter reports as `auth_failed`,
  # never as "this person does not exist" (fixed 0.15.0; before it, an active
  # employee read as not_found and their countersignature was refused).
  # LAAS_LDAP_BIND_DN: "cn=laas-directory-reader,ou=services,dc=example,dc=com"
  # LAAS_LDAP_BIND_PASSWORD: "CHANGE_ME"

  # Sigstore-oidc signing extras (when LAAS_SIGNING_METHOD=sigstore-oidc).
  # LAAS_OIDC_ISSUER_URL: "https://oauth2.sigstore.dev/auth"
  # LAAS_OIDC_CLIENT_ID: "sigstore"
  # LAAS_SIGNING_OIDC_TOKEN: "<workload-identity token>"
  # LAAS_SIGNING_EXPECTED_IDENTITY: "laas@example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: laas-signing-key
  labels:
    app.kubernetes.io/name: laas
    app.kubernetes.io/component: ledger-service
type: Opaque
stringData:
  # Mounted at /var/run/secrets/laas/signing-key/cosign.key (see configmap).
  cosign.key: |
    -----BEGIN ENCRYPTED SIGSTORE PRIVATE KEY-----
    REPLACE_ME
    -----END ENCRYPTED SIGSTORE PRIVATE KEY-----
