apiVersion: batch/v1
kind: CronJob
metadata:
  name: laas-verify
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: laas
          containers:
            - name: verify
              image: laas:latest
              command: ["python", "-m", "traust_ledger.cli", "verify", "--all"]
              envFrom:
                - configMapRef:
                    name: laas-config
                - secretRef:
                    name: laas-secrets
                    optional: true
              volumeMounts:
                - name: data
                  mountPath: /var/lib/laas/data
                  readOnly: true
          restartPolicy: OnFailure
          volumes:
            - name: data
              emptyDir: {}
              # PLACEHOLDER: production overlay MUST bind the real data volume
              # (PVC/NFS). The CLI exits non-zero when zero layers are found
              # so a misconfigured mount fails loudly rather than passing
              # vacuously.
