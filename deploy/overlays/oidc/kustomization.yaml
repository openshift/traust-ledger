apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OIDC identity posture. The base ConfigMap ships the `static` provider so a bare apply boots
# on minikube; that is a development convenience and not a posture. Deploy this
# overlay for anything real:
#
#     kubectl apply -k deploy/overlays/oidc/
#
# The employee-directory cross-check stays OFF here. It is optional by design
# (docs/auth.md): OIDC establishes who the caller is, and a directory only
# answers whether that identity is a current employee — a question most
# deployments have no directory to answer. Enable it by setting LAAS_LDAP_SERVER
# and LAAS_LDAP_BASE_DN below, plus the bind credential in laas-secrets, since
# many directories refuse anonymous search.

resources:
  - ../../serviceaccount.yaml
  - ../../configmap.yaml
  - ../../service.yaml
  - ../../deployment.yaml
  - ../../cronjob.yaml

patches:
  - path: oidc-configmap.yaml
    target:
      kind: ConfigMap
      name: laas-config
