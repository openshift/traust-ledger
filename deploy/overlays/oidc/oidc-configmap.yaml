apiVersion: v1
kind: ConfigMap
metadata:
  name: laas-config
data:
  # OIDC configuration for real deployments.
  # The base configmap defaults to oidc but without JWKS — this overlay
  # supplies the JWKS endpoint so the service can verify tokens.
  LAAS_IDENTITY_PROVIDER: "oidc"

  # REQUIRED — the provider refuses to start without a JWKS URL.
  LAAS_OIDC_JWKS_URL: "https://sso.example.com/realms/CHANGE_ME/protocol/openid-connect/certs"
  LAAS_OIDC_ISSUER: "https://sso.example.com/realms/CHANGE_ME"
  LAAS_OIDC_AUDIENCE: "laas-api"

  # Sign for real. The key path alone lets a broken mount degrade silently to
  # unsigned; REQUIRED alone fails loudly, which is the safe half. Set both.
  LAAS_SIGNING_REQUIRED: "true"
