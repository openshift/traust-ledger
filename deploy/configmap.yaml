apiVersion: v1
kind: ConfigMap
metadata:
  name: laas-config
  labels:
    app.kubernetes.io/name: laas
    app.kubernetes.io/component: ledger-service
data:
  # Non-secret defaults for a dev/minikube apply. Production: override auth, signing,
  # and backend via this ConfigMap plus laas-secrets (see secret.example.yaml).
  LAAS_BACKEND_TYPE: "file"
  LAAS_DATA_DIR: "/var/lib/laas/data"
  # Identity provider. OIDC is the only supported provider; machine callers
  # use client-credentials or projected service-account tokens.
  # Supply LAAS_OIDC_JWKS_URL via laas-secrets or the oidc overlay.
  LAAS_IDENTITY_PROVIDER: "oidc"
  LAAS_LOG_LEVEL: "INFO"
  # false leaves writes UNSIGNED with no error at the call site. Set it true in
  # any real deployment TOGETHER with a working key path: the path alone lets a
  # broken mount degrade silently, while REQUIRED alone fails loudly.
  LAAS_SIGNING_REQUIRED: "false"
  LAAS_SIGNING_METHOD: "cosign"
  # Points at the optional signing-key volume; unused while LAAS_SIGNING_REQUIRED=false.
  LAAS_SIGNING_KEY_PATH: "/var/run/secrets/laas/signing-key/cosign.key"
